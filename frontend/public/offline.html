<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - VRS Kenya</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #172554;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        text-align: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 40px 28px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: rgba(96, 165, 250, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
      p { color: #bfdbfe; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      .hint { color: #93c5fd; font-size: 12px; margin-top: 16px; }
      button {
        background: #ffffff;
        color: #172554;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.15s;
      }
      button:hover { transform: scale(1.04); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#128268;</div>
      <h1>You are offline</h1>
      <p>
        The Voter Registration Management System needs a network connection to
        load live data. Reconnect to continue.
      </p>
      <button onclick="location.reload()">Try Again</button>
      <p class="hint">Demo/Administrative System - Not an official election registration platform.</p>
    </div>
  </body>
</html>
